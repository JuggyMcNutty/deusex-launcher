; The launcher's own settings. Deliberately separate from the game's
; DeusEx.ini so that resetting the game configuration cannot take the path to
; the game files with it.

[Launcher]
; Where you put your own Deus Ex files. The install screen shows this path and
; lists what it still needs.
GameDir=/mnt/SDCARD/Roms/PORTS/DeusEx

; Names the config file, <GameDir>/System/<Package>.ini.
Package=DeusEx

; What to exec once configuration is settled. Relative paths resolve against
; the launcher's own directory.
GameCommand=./run-game.sh

; CPU mode while the game runs, as spruceOS names them for Ports: Smart,
; Performance or Overclock. Set from the launcher's Video tab; run-game.sh
; applies it and puts the previous CPU state back on exit.
CpuMode=Overclock
