; The renderers the Graphics page and Recovery offer, and what each needs.
;
; Two facts decide whether one can be chosen, and the launcher shows both:
;
;   EngineType  the Settings.json RenderDevice.Type value that selects it in
;               DXEngine, exact case. Empty means this engine build has no
;               backend for it.
;   Requires    the graphics API it needs from the machine: vulkan, gles, gl
;               or none, as the launcher's GPU probe finds them
;               (dxl-cli --probe).
;
; The choice goes to Settings.json; the engine falls back to no other when
; the one chosen does not start, so Recovery offers the rest.

[Renderers]
Renderer=Vulkan
Renderer=GLES

[Vulkan]
Label=Vulkan
EngineType=Vulkan
Requires=vulkan
Description=DXEngine's main renderer. On the Smart Pro's PowerVR GE8300 it runs on the engine's non-bindless texture path, with textures the GPU cannot sample decoded on the CPU.

[GLES]
Label=OpenGL ES
EngineType=GLES
Requires=gles
Description=OpenGL ES 3.2 through the device's EGL driver: DXEngine's OpenGL renderer on an ES context, the same scene and present passes as its Vulkan one. Textures the GPU cannot sample (BC1) or filter (RGBA32F lightmaps) are decoded on the CPU, as the Vulkan renderer decodes them.
