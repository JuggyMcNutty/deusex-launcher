; The renderers the Graphics page and Recovery offer, and what each needs.
;
; Two facts decide whether one can be chosen, and the launcher shows both:
;
;   EngineType  the Settings.json RenderDevice.Type value that selects it in
;               DXEngine, exact case. Empty means this engine build has no
;               backend for it.
;   Requires    the graphics API it needs from the machine: vulkan, gles, gl
;               or none, as the launcher's GPU probe finds them
;               (dxl-cli --probe).
;
; The choice goes to Settings.json; the engine falls back to no other when
; the one chosen does not start, so Recovery offers the rest.
;
; Windows has no OpenGL ES of its own; its engine's D3D11 renderer is not
; offered until it draws as the Vulkan one does.

[Renderers]
Renderer=Vulkan
Renderer=OpenGL

[Vulkan]
Label=Vulkan
EngineType=Vulkan
Requires=vulkan
Description=DXEngine's main renderer.

[OpenGL]
Label=OpenGL
EngineType=OpenGL
Requires=gl
Description=DXEngine's OpenGL renderer, on a desktop OpenGL 4.2 context.
