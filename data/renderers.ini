; The renderers the Graphics page and Recovery offer, and what each needs.
;
; Two facts decide whether one can be chosen, and the launcher shows both:
;
;   EngineType  the Settings.json RenderDevice.Type value that selects it in
;               VibeEngine, exact case. Empty means this engine build has no
;               backend for it.
;   Requires    the graphics API it needs from the machine: vulkan, gles, gl
;               or none, as the launcher's GPU probe finds them
;               (dxl-cli --probe).
;
; The choice goes to Settings.json; the engine falls back to no other when
; the one chosen does not start, so Recovery offers the rest.

[Renderers]
Renderer=Vulkan
Renderer=OpenGL
Renderer=GLES

[Vulkan]
Label=Vulkan
EngineType=Vulkan
Requires=vulkan
Description=VibeEngine's main renderer.

[OpenGL]
Label=OpenGL
EngineType=OpenGL
Requires=gl
Description=VibeEngine's OpenGL renderer, on a desktop OpenGL 4.2 context.

[GLES]
Label=OpenGL ES
EngineType=GLES
Requires=gles
Description=The same OpenGL renderer on an OpenGL ES 3.2 context, for a driver with OpenGL ES alone.
