; The renderers the Graphics page and Recovery offer, and what each needs.
;
; Two keys decide whether one can be chosen, and the launcher shows both;
; the third says how it draws:
;
;   EngineType  the Settings.json RenderDevice.Type value that selects it in
;               DXEngine, exact case. Empty means this engine build has no
;               backend for it.
;   Requires    the graphics API it needs from the machine: vulkan, gles, gl,
;               vulkan-cpu, gl-cpu (Mesa's CPU drivers, lavapipe and
;               llvmpipe) or none, as the launcher's GPU probe finds them
;               (dxl-cli --probe).
;   CPUDriver   1: the engine asked to draw through Mesa's CPU driver
;               (Settings.json's CPUDriver), which it otherwise takes for
;               no GPU and leaves to its software renderer.
;
; The choice goes to Settings.json. Where a GPU renderer does not start, the
; engine draws with its software renderer instead and logs why (Recovery's
; advice); Recovery offers the rest.

[Renderers]
Renderer=Vulkan
Renderer=OpenGL
Renderer=GLES
Renderer=Software
Renderer=VulkanCPU
Renderer=OpenGLCPU

[Vulkan]
Label=Vulkan
EngineType=Vulkan
Requires=vulkan
Description=DXEngine's main renderer.

[OpenGL]
Label=OpenGL
EngineType=OpenGL
Requires=gl
Description=DXEngine's OpenGL renderer, on a desktop OpenGL 4.2 context.

[GLES]
Label=OpenGL ES
EngineType=GLES
Requires=gles
Description=The same OpenGL renderer on an OpenGL ES 3.1 context or later, for a driver with OpenGL ES alone.

[Software]
Label=Software
EngineType=Software
Requires=none
Description=DXEngine's software renderer: the game drawn on the CPU, on every core, for a machine whose GPU has no driver the others can use.

[VulkanCPU]
Label=Vulkan (lavapipe)
EngineType=Vulkan
CPUDriver=1
Requires=vulkan-cpu
Description=The Vulkan renderer on Mesa's lavapipe, which draws on the CPU: slower than the software renderer.

[OpenGLCPU]
Label=OpenGL (llvmpipe)
EngineType=OpenGL
CPUDriver=1
Requires=gl-cpu
Description=The OpenGL renderer on Mesa's llvmpipe, which draws on the CPU: slower than the software renderer.
